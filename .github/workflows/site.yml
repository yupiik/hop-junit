name: deploy-site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  MAVEN_ARGS: -B -q -T1C -Daether.connector.basic.downstreamThreads=128

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # composite action: checkout + JDK + maven cache + maven install (from Maven Central)
      - name: Setup Maven Action
        uses: s4u/setup-maven-action@6f4258affaf478b384ea1efa19f5938ffe9388c5
        with:
          maven-version: '3.9.16'
          java-version: '25'
          java-distribution: temurin
          # full history so spotless ratchet (ratchetFrom=origin/main, once enabled) finds its merge base
          checkout-fetch-depth: '0'

      # tests are skipped here - the build.yml/pr.yml workflows already run them.
      # install the reactor so the documentation module resolves its subproject dependencies
      # (hop-junit-core, database modules) from the local repository.
      - name: Build reactor
        run: mvn ${MAVEN_ARGS} install -DskipTests

      # the documentation minisite execution is bound to phase=package, so the install above
      # already rendered it into hop-junit-documentation/target/site
      - name: Verify site
        run: test -d hop-junit-documentation/target/site

      # configure GitHub Pages + upload the rendered site as a Pages artifact
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: hop-junit-documentation/target/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5