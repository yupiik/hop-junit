name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-main
  cancel-in-progress: true

env:
  MAVEN_ARGS: -B -q -T1C -Daether.connector.basic.downstreamThreads=128

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # composite action: checkout + JDK + maven cache + maven install (from Maven Central)
      - name: Setup Maven Action
        uses: s4u/setup-maven-action@8da9a2ce045f6f610f43985a87a62f256e963374
        with:
          maven-version: '3.9.16'
          java-version: '25'
          java-distribution: temurin
          # full history so spotless ratchet (ratchetFrom=origin/main, once enabled) finds its merge base
          checkout-fetch-depth: '0'

      - name: Build (incl. Oracle/Testcontainers tests)
        run: mvn ${MAVEN_ARGS} verify